services:
  takttusur.inmemoria.api:
    image: takttusur.inmemoria.api
    build:
      context: .
      dockerfile: TaktTusur.InMemoria.Api/Dockerfile

  takttusur.inmemoria.migrationapp:
    image: takttusur.inmemoria.migrationapp
    build:
      context: .
      dockerfile: TaktTusur.InMemoria.MigrationApp/Dockerfile

  takttusu.inmemoria.mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: migrationPassword
